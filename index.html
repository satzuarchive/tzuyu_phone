/* ===== LINE chat fixed layout ===== */

/* 整个 LINE 聊天页面不滚动 */
.screen:has(> .chat) {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding-bottom: 0;
}

/* 顶部导航栏固定 */
.screen:has(> .chat) > .nav {
  flex: none;
}

/* 只有中间的消息区域可以滚动 */
.screen:has(> .chat) > .chat {
  flex: 1 1 0 !important;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}

/* 底部输入框始终固定 */
.screen:has(> .chat) > .line-input {
  position: relative;
  flex: none;
  margin-top: 0;
  z-index: 10;
  background: #fff;
}
/* ===== IG DM translation ===== */
.ig-dm-bubble {
  cursor: pointer;
  transition: background .2s ease;
}

.ig-dm-bubble .zh {
  display: none;
  margin-top: 8px;
  padding-top: 7px;
  border-top: 1px solid rgba(0,0,0,.08);
  font-size: 12px;
  line-height: 1.5;
  opacity: .9;
}

.ig-dm-bubble.open .zh {
  display: block;
}

.ig-dm-bubble .zh em {
  display: block;
  font-style: normal;
  font-size: 10px;
  opacity: .7;
  margin-bottom: 2px;
}

/* ===== Instagram: fixed bottom navigation, scroll only the feed ===== */
.screen.ig-fixed-tabs {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding-bottom: 0;
  background: #fff;
}
.screen.ig-fixed-tabs > .ig-page-scroll {
  flex: 1 1 0 !important;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  scrollbar-width: none;
}
.screen.ig-fixed-tabs > .ig-page-scroll::-webkit-scrollbar { display: none; }
.screen.ig-fixed-tabs > .ig-page-scroll .ig-top { top: 0; }
.screen.ig-fixed-tabs > .tabbar {
  position: relative;
  bottom: auto;
  flex: none !important;
  margin-top: 0;
  z-index: 8;
  padding-bottom: 27px;
}
/* Instagram DM: fixed header & composer; only messages scroll */
.screen:has(> .ig-dm-chat) {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding-bottom: 0;
  background: #fff;
}
.screen:has(> .ig-dm-chat) > .ig-top { flex: none; }
.screen:has(> .ig-dm-chat) > .ig-dm-chat {
  flex: 1 1 0 !important;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 12px 14px 18px;
}
.screen:has(> .ig-dm-chat) > .ig-dm-compose {
  position: relative;
  flex: none;
  bottom: auto;
  z-index: 8;
  margin: 0 12px 28px;
  padding: 5px 6px 5px 5px;
  border: 1px solid #dcdde3;
  border-radius: 27px;
  background: #fff;
}
.screen:has(> .ig-dm-chat) > .ig-dm-compose input { min-width:0; }
.screen:has(> .ig-dm-chat) > .ig-dm-compose button {
  background: #0095f6;
  color: #fff;
  border-radius: 18px;
  padding: 8px 13px;
  font-size: 13px;
  flex: none;
}
.ig-dm-date {
  text-align: center;
  color: #999;
  font-size: 12px;
  margin: 12px 0 19px;
}
/* Instagram-like Dynamic Island incoming DM */
.status .island {
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  z-index: 40;
  transition: width .32s cubic-bezier(.2,.8,.2,1),
              height .32s cubic-bezier(.2,.8,.2,1),
              border-radius .32s ease;
}
.status .island.island-expanded {
  width: min(338px, calc(100% - 22px));
  height: 78px;
  border-radius: 26px;
  box-shadow: 0 12px 30px #0004;
}
.island-notification {
  display: flex;
  gap: 11px;
  align-items: center;
  width: 100%;
  padding: 0 14px;
  color: #fff;
  opacity: 0;
  transform: translateY(-5px) scale(.95);
  transition: opacity .16s ease, transform .22s ease;
}
.island-expanded .island-notification {
  opacity: 1;
  transform: translateY(0) scale(1);
  transition-delay: .08s;
}
.island-ig-icon,
.island-ig-icon svg {
  display: block;
  width: 39px;
  height: 39px;
  flex: none;
}
.island-copy { min-width: 0; flex: 1; }
.island-copy b {
  display: block;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.4;
  margin-bottom: 4px;
}
.island-copy span {
  display: block;
  font-size: 14px;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}


/* ===== HOME ICON SCALE: larger iPhone-style icons (2026-10-22) ===== */
/* Change the two values below to adjust only HOME icons, not icons inside apps. */
.home {
  --home-icon-size: 60px;
  --dock-icon-size: 59px;
}
.home .apps {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  column-gap: 4px;
  row-gap: 15px;
}
.home .app {
  gap: 6px;
  font-size: 12px;
  line-height: 1.15;
  min-width: 0;
}
.home .app-icon {
  width: var(--home-icon-size);
  height: var(--home-icon-size);
  border-radius: 17px;
  flex: none;
}
.home .app-icon svg,
.home .app-icon img {
  display: block;
  width: 100%;
  height: 100%;
}
.home .dock {
  box-sizing: border-box;
  width: calc(100% + 20px);
  margin-left: -10px;
  padding: 10px 8px;
  border-radius: 36px;
  flex-shrink: 0;
}
.home .dock .app-icon {
  width: var(--dock-icon-size);
  height: var(--dock-icon-size);
  border-radius: 17px;
}
.home .home-pager { margin-bottom: 12px; }
/* Narrow phones: retain a four-column grid instead of overflowing. */
@media(max-width:0px) {
  .home {
    --home-icon-size: clamp(55px, 17.9vw, 60px);
    --dock-icon-size: clamp(55px, 17.7vw, 59px);
  }
}
@media(max-height:0px) {
  .home .apps { row-gap: 9px; }
  .home .app { gap: 4px; font-size: 11px; }
}


/* ===== Swipe-to-unlock: only lock screen + home arrival ===== */
.lock-screen {
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
  will-change: transform, opacity;
}
.lock-screen:active { cursor: grabbing; }
.lock-screen.unlock-snapback {
  transition: transform .32s cubic-bezier(.22,1,.36,1), opacity .32s ease;
}
.lock-hint {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  letter-spacing: .2px;
}
.lock-hint::before {
  content: "⌃";
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 24px;
  line-height: 19px;
  font-weight: 400;
  animation: swipeHintRise 1.9s ease-in-out infinite;
}
@keyframes swipeHintRise {
  0%,100% { transform: translateY(3px); opacity: .55; }
  55% { transform: translateY(-4px); opacity: 1; }
}
/* Overlay holds the original lock screen while the home screen appears beneath it. */
.unlock-overlay {
  position: absolute;
  inset: 0;
  z-index: 16;
  overflow: hidden;
  border-radius: 46px;
  pointer-events: none;
  opacity: 1;
  transform: translate3d(0,0,0);
  filter: blur(0);
  transition: transform .56s cubic-bezier(.22,1,.36,1),
              opacity .48s ease,
              filter .56s ease;
  will-change: transform, opacity;
}
.unlock-overlay.leaving {
  transform: translate3d(0,-106%,0);
  opacity: 0;
  filter: blur(6px);
}
.unlock-overlay .lock-screen {
  height: 100%;
  transform: none !important;
  opacity: 1 !important;
  pointer-events: none;
}
/* Small stagger gives home widgets, apps and dock a natural arrival. */
.home.swipe-unlock-enter .widgets {
  animation: swipeHomeAppear .58s cubic-bezier(.22,1,.36,1) both;
}
.home.swipe-unlock-enter .apps {
  animation: swipeHomeAppear .62s cubic-bezier(.22,1,.36,1) .045s both;
}
.home.swipe-unlock-enter .dock {
  animation: swipeHomeAppear .56s cubic-bezier(.22,1,.36,1) .085s both;
}
.home.swipe-unlock-enter .home-pager {
  animation: swipeHomeAppear .55s cubic-bezier(.22,1,.36,1) .07s both;
}
@keyframes swipeHomeAppear {
  from { opacity: 0; transform: translateY(29px) scale(.965); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@media(max-width:0px) { .unlock-overlay { border-radius: 0; } }
@media (prefers-reduced-motion: reduce) {
  .lock-hint::before, .home.swipe-unlock-enter .widgets,
  .home.swipe-unlock-enter .apps, .home.swipe-unlock-enter .dock,
  .home.swipe-unlock-enter .home-pager { animation: none !important; }
  .unlock-overlay { transition-duration: .01ms !important; }
}

// ===== iPhone-like swipe unlock: touch / mouse drag / click / keyboard =====
let isUnlocking = false;
function unlockPhone(startOffset = 0) {
  if (isUnlocking || stack[stack.length - 1].page !== 'lock') return;
  const lockView = document.getElementById('lockScreen');
  if (!lockView) return;
  isUnlocking = true;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    home();
    isUnlocking = false;
    return;
  }

  // Capture the actual user-selected lock wallpaper, not a substitute wallpaper.
  const style = window.getComputedStyle(el);
  const overlay = document.createElement('div');
  overlay.className = 'unlock-overlay';
  for (const key of ['backgroundImage','backgroundColor','backgroundPosition','backgroundSize','backgroundRepeat']) {
    overlay.style[key] = style[key];
  }
  const snapshot = lockView.cloneNode(true);
  snapshot.removeAttribute('id');
  snapshot.removeAttribute('tabindex');
  snapshot.querySelectorAll('[id]').forEach(node => node.removeAttribute('id'));
  snapshot.style.transform = '';
  snapshot.style.opacity = '';
  snapshot.classList.remove('unlock-snapback');
  overlay.appendChild(snapshot);
  overlay.style.transform = `translate3d(0, -${Math.max(0, Math.min(180, startOffset))}px, 0)`;

  // Render the existing home; no desktop icons or app screens are replaced.
  home();
  document.querySelector('.phone').appendChild(overlay);
  const desktop = el.querySelector('.home');
  if (desktop) desktop.classList.add('swipe-unlock-enter');
  requestAnimationFrame(() => requestAnimationFrame(() => {
    overlay.style.transform = '';
    overlay.classList.add('leaving');
  }));
  window.setTimeout(() => {
    overlay.remove();
    if (desktop) desktop.classList.remove('swipe-unlock-enter');
    isUnlocking = false;
  }, 720);
}

function bindLockGestures(lockView) {

  const resetDrag = () => {

      resetDrag();

    start = null;
    blockNextClick = true;
    resetDrag();

// Home screen paging: drag with finger or mouse, the pages follow and snap.
function bindHomeSwipe(hs){
  const track=document.getElementById('homeTrack');if(!track)return;
  const PAGES_N=2;let st=null,dragged=false;
  const scale=()=>document.querySelector('.phone').getBoundingClientRect().width/384||1;
  const setDots=()=>hs.querySelectorAll('.home-pager [data-page]').forEach(b=>b.classList.toggle('active',Number(b.dataset.page)===homePage));
  const settle=()=>{track.style.transition='transform .32s cubic-bezier(.22,1,.36,1)';track.style.transform=`translateX(${-homePage*100}%)`;setDots()};
  hs.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;st={id:e.pointerId,x:e.clientX,y:e.clientY,w:track.parentElement.clientWidth,on:false};dragged=false});
  hs.addEventListener('pointermove',e=>{
    if(!st||e.pointerId!==st.id)return;
    const dx=(e.clientX-st.x)/scale(),dy=(e.clientY-st.y)/scale();
    if(!st.on){if(Math.abs(dx)<8||Math.abs(dx)<Math.abs(dy))return;st.on=true;dragged=true;track.style.transition='none';try{hs.setPointerCapture(e.pointerId)}catch(_){}}
    let off=dx;if((homePage===0&&dx>0)||(homePage===PAGES_N-1&&dx<0))off=dx*.3;
    st.dx=dx;track.style.transform=`translateX(${-homePage*st.w+off}px)`;
  });
  const end=e=>{
    if(!st||e.pointerId!==st.id)return;const dx=st.dx||0,was=st.on;st=null;
    if(!was)return;
    if(dx<-50&&homePage<PAGES_N-1)homePage++;else if(dx>50&&homePage>0)homePage--;
    settle();
  };
  hs.addEventListener('pointerup',end);hs.addEventListener('pointercancel',end);
  hs.addEventListener('click',e=>{if(dragged){e.stopPropagation();e.preventDefault();dragged=false}},true);
  hs.querySelectorAll('.home-pager [data-page]').forEach(b=>b.addEventListener('click',e=>{e.stopImmediatePropagation();homePage=Number(b.dataset.page);settle()},true));
}

<script>
// This layer changes how bright the fictional iPhone looks, not the device's hardware brightness.
(function(){
  const phone = document.querySelector('.phone');
  const shade = document.createElement('div');
  shade.className = 'brightness-shade';
  shade.id = 'brightnessShade';
  shade.setAttribute('aria-hidden','true');
  phone.appendChild(shade);

  let brightness = .9;
  try {
    const saved = localStorage.getItem('tzuyu-screen-brightness');
    if(saved !== null && Number.isFinite(Number(saved))) brightness = Math.min(1,Math.max(0,Number(saved)));
  } catch (_) { /* Storage may be unavailable in local-file previews. */ }
  const updateBrightness = value => {
    brightness = Math.min(1,Math.max(0,Number(value)));
    shade.style.opacity = String((1-brightness)*.83);
    const percent = document.getElementById('brightnessValue');
    if(percent) percent.textContent = Math.round(brightness*100)+'%';
    try { localStorage.setItem('tzuyu-screen-brightness',String(brightness)); } catch (_) {}
  };
  const sun = (size) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>`;

  const baseRender = render;
  render = function(){
    baseRender();
    const {page,id} = stack[stack.length-1];
    if(page==='note'){
      const note = story.notes[Number(id)];
      const detail = el.querySelector('.detail');
      if(note && detail){
        detail.classList.add('note-reader');
        detail.innerHTML = `<small>${escapeHtml(note.date)}</small><h2>${escapeHtml(note.title)}</h2>`
          +`<button type="button" class="note-text-toggle" aria-expanded="false" aria-label="點擊顯示翻譯">`
          +`<span class="note-japanese" lang="zh-Hant">${escapeHtml(note.body)}</span>`
          +(note.zhBody?`<span class="note-chinese" lang="zh-Hant"><b>${escapeHtml(note.zhTitle||'翻譯')}</b>${escapeHtml(note.zhBody)}</span>`:'')
          +`${note.zhBody?`<span class="note-translate-hint">${sun(14)} <span class="note-hint-label">點擊顯示翻譯</span></span>`:''}</button>`;
        const toggle = detail.querySelector('.note-text-toggle');
        if(note.zhBody)toggle.addEventListener('click',()=>{
          const opened = toggle.classList.toggle('open');
          toggle.setAttribute('aria-expanded',String(opened));
          toggle.setAttribute('aria-label',opened?'點擊收起翻譯':'點擊顯示翻譯');
          toggle.querySelector('.note-hint-label').textContent = opened?'收起翻譯':'點擊顯示翻譯';
        });
      }
    }
    if(page==='settings'){
      const displayRow = Array.from(el.querySelectorAll('.set-row')).find(row=>row.querySelector('span')?.textContent==='顯示與亮度');
      if(displayRow){
        displayRow.classList.add('set-interactive');
        displayRow.setAttribute('role','button');
        displayRow.setAttribute('tabindex','0');
        displayRow.setAttribute('aria-label','顯示與亮度設定');
        const open = () => go('display-brightness');
        displayRow.addEventListener('click',open);
        displayRow.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
      }
    }
    if(page==='display-brightness'){
      el.innerHTML = `<div class="display-settings">${nav('顯示與亮度')}`
       +`<h1 class="display-intro">顯示與亮度</h1>`
       +`<section class="brightness-card"><div class="brightness-head"><label for="brightnessSlider">亮度</label><span class="brightness-value" id="brightnessValue">${Math.round(brightness*100)}%</span></div>`
       +`<div class="brightness-slider-row">${sun(18)}<input id="brightnessSlider" aria-label="螢幕亮度" type="range" min="0" max="100" step="1" value="${Math.round(brightness*100)}">${sun(28)}</div></section>`
       +`<p class="brightness-explain">拖動滑桿可調節虛構 iPhone 畫面的亮度；再次開啟會保留設定。</p></div>`;
      el.scrollTop=0;
      el.querySelector('[data-back]').addEventListener('click',back);
      el.querySelector('#brightnessSlider').addEventListener('input',e=>updateBrightness(e.target.value/100));
    }
  };
  updateBrightness(brightness);
})();
</script>

  /* ---------- Music (Spotify-style) ----------

  const artCls=i=>coverOf(songs()[i])?' has-cover':'';
  const SP={api:null,ctrl:null,uri:'',loading:false,failed:false,queue:[],host:null,st:{paused:true,pos:0,dur:0,at:0},was:false};

      const uri='spotify:track:'+id;
      const go_=c=>{try{if(play){(restart||!c.resume)?c.play():c.resume()}else if(c.pause)c.pause()}catch(e){}};
      if(SP.ctrl){if(SP.uri!==uri){SP.uri=uri;SP.st={paused:true,pos:0,dur:0,at:Date.now()};SP.ctrl.loadUri(uri);if(play)setTimeout(()=>go_(SP.ctrl),500)}else go_(SP.ctrl);return}
      SP.uri=uri;
      SP.api.createController(document.getElementById('spEmbedTarget'),{uri,width:'100%',height:80},c=>{
        SP.ctrl=c;
        c.addListener('ready',()=>{if(play)go_(c)});
        c.addListener('playback_update',e=>{
          const d=e.data||{},wasPaused=SP.st.paused;
          SP.st={paused:!!d.isPaused,pos:(d.position||0)/1000,dur:(d.duration||0)/1000,at:Date.now()};
          const s2=cur();if(!s2||mode(s2)!=='spotify'||!spMatch(s2))return;
          const ended=SP.was&&d.isPaused&&d.duration>0&&d.position>=d.duration-800;
          SP.was=!d.isPaused;
          if(ended){musicNext(true);return}
          if(S.mu.playing!==!d.isPaused){S.mu.playing=!d.isPaused;if(onMusicPage())rerender()}
          else if(wasPaused!==SP.st.paused&&onMusicPage())rerender();
        });
      });
    });
  }
  function syncPlayback(restart){
    const s=cur();if(!s)return;const m=mode(s);
    if(m!=='file')player.pause();
    if(m!=='spotify'&&SP.ctrl&&!SP.st.paused){try{SP.ctrl.pause()}catch(e){}}
    if(m==='file'){
      const src=String(s.audio).trim();
      if(player.dataset.src!==src){player.dataset.src=src;player.src=encodeURI(src);restart=true}
      if(restart){try{player.currentTime=0}catch(e){}}
      if(S.mu.playing){const p=player.play();if(p&&p.catch)p.catch(()=>{})}else player.pause();
    }else if(m==='spotify'){spControl(s,S.mu.playing,restart)}
  }
  function musicNext(auto){const n=songs().length;if(!n)return;S.mu.idx=(S.mu.idx+1)%n;S.mu.pos=0;if(auto)S.mu.playing=true;syncPlayback(true);if(onMusicPage())rerender()}
  player.addEventListener('error',()=>{const src=player.dataset.src;if(!src)return;badAudio[src]=true;player.dataset.src='';if(S.mu.playing)syncPlayback(true);if(onMusicPage())rerender()});
  player.addEventListener('ended',()=>musicNext(true));

  const SPI={

    shuffle:'M3 7h3c5 0 7 10 12 10h3M18 14l3 3-3 3M3 17h3c1.5 0 2.7-.9 3.7-2.2M13.3 9.2C14.3 7.9 15.5 7 17 7h4M18 4l3 3-3 3',repeat:'M4 11V9a3 3 0 0 1 3-3h13l-3-3M20 13v2a3 3 0 0 1-3 3H4l3 3',
    plusc:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 8v8M8 12h8',down:'M6 9l6 6 6-6',dl:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v9M8.5 12.5 12 16l3.5-3.5'
  };

  const playGlyph=(on,sz)=>on?`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>`:`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"/></svg>`;

  function miniPlayer(){const s=cur();if(!s)return '';const p=S.mu.pos/songLen(s)*100;

  function pageMusic(){

      +list.map((s,i)=>`<button class="sp-row${i===S.mu.idx?' now':''}" data-act="mu-play" data-i="${i}"><span class="art${artCls(i)}" data-cover="${i}" style="${artStyle(i)}">${i===S.mu.idx&&S.mu.playing?'<i class="eq"><b></b><b></b><b></b></i>':''}</span><span class="tx"><b>${E(s.title)}</b><small>${modeTag(s)}${E(s.artist)}</small></span><span class="dots">${ic('more',20,3)}</span></button>`).join('')

  /* ---------- Maps ---------- */

  /* ---------- Settings icons (iOS-style glyphs on the coloured squares) ---------- */

  function lockMusicHtml(){

  /* ---------- Dynamic Island: now-playing indicator ---------- */
  let islandKey='';
  function updateIslandMusic(){
    const island=document.querySelector('#status .island');if(!island||island.classList.contains('island-expanded'))return;
    const page=stack[stack.length-1].page,s=cur();

  document.querySelector('#status .island').addEventListener('click',()=>{

  const PAGES={clock:pageClock,weather:pageWeather,wxcity:pageWxCity,stocks:pageStocks,stock:pageStock,music:pageMusic,nowplaying:pageNowPlaying,books:pageBooks,book:pageBook,podcasts:pagePodcasts,podcast:pagePodcast,safari:pageSafari,blog:pageBlog,mail:pageMail,mailmsg:pageMailMsg,maps:pageMaps};

  function act(b,e){

    if(a==='alarm'){const al=story.alarms[i];al[2]=!al[2];rerender();return}
    if(a==='sw-go'){if(S.sw.run){S.sw.acc+=Date.now()-S.sw.t0;S.sw.run=false}else{S.sw.t0=Date.now();S.sw.run=true}rerender();return}
    if(a==='sw-lap'){if(S.sw.run)S.sw.laps.unshift(swNow());else{S.sw.acc=0;S.sw.laps=[]}rerender();return}
    if(a==='tm-go'){if(S.tm.run){S.tm.left=tmNow();S.tm.run=false}else{if(S.tm.left<=0)S.tm.left=S.tm.total;S.tm.end=Date.now()+S.tm.left;S.tm.run=true}rerender();return}
    if(a==='tm-reset'){S.tm.run=false;S.tm.left=S.tm.total;rerender();return}
    if(a==='wx'){stack[stack.length-1].id=String(i);draw();return}
    if(a==='skmode'){S.skMode=S.skMode==='pct'?'chg':'pct';rerender();return}
    if(a==='skr'){S.skRange=b.dataset.r;rerender();return}
    if(a==='mu-play'){S.mu.idx=i;S.mu.pos=0;S.mu.playing=true;syncPlayback(true);go('nowplaying');return}
    if(a==='mu-shuffle'){const n=songs().length;if(!n)return;let k=Math.floor(Math.random()*n);if(n>1&&k===S.mu.idx)k=(k+1)%n;S.mu.idx=k;S.mu.pos=0;S.mu.playing=true;syncPlayback(true);if(stack.at(-1).page==='nowplaying')rerender();else go('nowplaying');return}
    if(a==='mu-toggle'){S.mu.playing=!S.mu.playing;syncPlayback(false);rerender();return}
    if(a==='mu-next'||a==='mu-prev'){const n=songs().length;if(!n)return;if(a==='mu-prev'&&S.mu.pos>3){S.mu.pos=0;syncPlayback(true)}else{S.mu.idx=(S.mu.idx+(a==='mu-next'?1:n-1))%n;S.mu.pos=0;syncPlayback(true)}rerender();return}
    if(a==='pc'){S.pcPlaying=S.pcPlaying===i?-1:i;rerender();return}
    if(a==='mail'){const m=story.mail[i];if(m)m.unread=false;go('mailmsg',String(i));return}
    if(a==='mp'){S.mapSel=i;draw();return}
  }
  function draw(){
    const {page,id}=stack[stack.length-1];
    el.className='screen xa-screen';el.style.backgroundImage='';
    el.innerHTML=PAGES[page](id);
    const dark=DARK.has(page);
    document.querySelector('.phone').classList.toggle('dark-ui',dark);
    bar.className='homebar'+(dark?' light':'');
    el.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',e=>act(b,e)));
    el.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go,b.dataset.id)));
    el.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',back));
    if(SP.host)SP.host.classList.toggle('show',page==='nowplaying'&&!!cur()&&mode(cur())==='spotify');
  }
  const baseRender=render;
  render=function(){
    baseRender();
    const {page}=stack[stack.length-1];
    if(PAGES[page]){draw();el.scrollTop=0}
    if(page==='settings')decorateSettings();
    if(page==='lock')addLockNotifications();
    if(SP.host)SP.host.classList.toggle('show',page==='nowplaying'&&cur()&&mode(cur())==='spotify');
  };
  if(stack[stack.length-1].page==='lock')addLockNotifications();
  let last=Date.now();
  setInterval(()=>{
    const now=Date.now(),dt=(now-last)/1000;last=now;
    updateIslandMusic();
    if(stack[stack.length-1].page==='lock'){
      const want=lockMusicWanted(),key=want?`${S.mu.idx}|${S.mu.playing}|${coverOf(cur())}`:'';
      if(key!==lockMusicKey||want!==!!document.querySelector('#lockScreen .lm-card'))refreshLockMusic();
    }else lockMusicKeep=false;
    const sw=document.getElementById('swTime');if(sw)sw.textContent=fmtSW(swNow());

    const tm=document.getElementById('tmTime');if(tm){const l=tmNow();tm.textContent=fmtTM(l);const arc=document.getElementById('tmArc');if(arc){const C=2*Math.PI*125;arc.setAttribute('stroke-dashoffset',String(C*(1-(S.tm.total?l/S.tm.total:0))))}}
    const s=cur();
    if(s){const m=mode(s),d=songLen(s);
      if(m==='file'){if(player.dataset.src===String(s.audio).trim())S.mu.pos=player.currentTime||0}
      else if(m==='spotify'){if(spMatch(s))S.mu.pos=Math.min(d,SP.st.pos+(SP.st.paused?0:(now-SP.st.at)/1000))}
      else if(S.mu.playing){S.mu.pos+=dt;if(S.mu.pos>=d){musicNext(false);return}}
      const p=Math.min(100,S.mu.pos/d*100);const nb=document.getElementById('npBar');if(nb)nb.style.width=p+'%';const mb=document.getElementById('miniBar');if(mb)mb.style.width=p+'%';const np=document.getElementById('npPos');if(np)np.textContent=mmss(S.mu.pos);const lb=document.getElementById('lmBar');if(lb){lb.style.width=p+'%';document.getElementById('lmPos').textContent=mmss(S.mu.pos);document.getElementById('lmLeft').textContent='-'+mmss(d-S.mu.pos)}const nl=document.getElementById('npLeft');if(nl)nl.textContent='-'+mmss(d-S.mu.pos)}
  },100);
})();

<script>
/* ===== iOS 風格轉場：App 開啟／關閉縮放、頁面推入／返回滑動、解鎖上滑 ===== */
(function(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const EZ='cubic-bezier(.32,.72,0,1)';
  const R=46;
  const origins={};
  let lastClick=null,cleanup=null;
  let tabAt=0;
  document.addEventListener('click',e=>{
    if(e.target.closest){const m=e.target.closest('.tabbar,.xa-tabs,.sp-tabs,[class*="-tabs"],[role="tablist"]');if(m&&m!==el&&m!==document.body)tabAt=Date.now()}
    const t=e.target.closest&&e.target.closest('.home [data-go]');
    if(!t)return;
    const ic=t.querySelector('.app-icon')||t;
    lastClick={page:t.dataset.go,rect:ic.getBoundingClientRect(),at:Date.now()};
  },true);

  function ghostOf(){
    const g=el.cloneNode(true);
    g.querySelectorAll('video,audio,iframe').forEach(n=>n.remove());
    Object.assign(g.style,{position:'absolute',left:el.offsetLeft+'px',top:el.offsetTop+'px',width:el.offsetWidth+'px',height:el.offsetHeight+'px',margin:'0',pointerEvents:'none',zIndex:'2'});
    el.parentNode.insertBefore(g,el.nextSibling);
    g.scrollTop=el.scrollTop;
    return g;
  }
  const local=(r)=>{
    const er=el.getBoundingClientRect(),k=er.width/el.offsetWidth||1;
    const w=r.width/k,h=r.height/k;
    return {w,h,cx:(r.left-er.left)/k+w/2,cy:(r.top-er.top)/k+h/2};
  };
  const clipInset=(t,r,b,l,rad)=>`inset(${t}px ${r}px ${b}px ${l}px round ${rad}px)`;
  // 把整個畫面縮成 icon 大小（以方形視窗裁切）
  function iconPose(o){
    const W=el.offsetWidth,H=el.offsetHeight;
    const s=Math.max(.05,o.w/W);
    const v=Math.max(0,(H-W)/2);
    return {
      transform:`translate(${o.cx-W/2}px,${o.cy-H/2}px) scale(${s})`,
      clipPath:clipInset(v,0,v,0,o.w*.225/s)
    };
  }
  const FULL={transform:'translate(0px,0px) scale(1)',clipPath:clipInset(0,0,0,0,R)};
  const play=(n,frames,ms,extra={})=>n.animate(frames,Object.assign({duration:ms,easing:EZ,fill:'both'},extra));

  let prev={page:stack[stack.length-1].page,depth:stack.length,key:stack[stack.length-1].page+'|'+stack.length+'|',root:null};
  const baseRender=render;
  render=function(){
    const top=stack[stack.length-1],depth=stack.length;
    const key=top.page+'|'+depth+'|'+(top.id==null?'':top.id);
    const old=prev;
    if(cleanup){cleanup();cleanup=null}
    let kind=key===old.key?null:
      (old.page==='home'&&depth>old.depth)?'open':
      (top.page==='home'&&old.page!=='home'&&old.page!=='lock')?'close':
      (old.page==='lock'&&top.page!=='lock')?'unlock':
      (old.page!=='home'&&old.page!=='lock'&&top.page!=='home'&&top.page!=='lock')?(depth>old.depth?'push':depth<old.depth?'pop':null):null;
    if((kind==='push'||kind==='pop')&&Date.now()-tabAt<600)kind=null; // 切換分頁/選項：直接切，不滑動
    const g=kind?ghostOf():null;
    baseRender();
    prev={page:top.page,depth,key,root:stack[1]?stack[1].page:null};
    if(!kind)return;
    const W=el.offsetWidth,H=el.offsetHeight;
    const anims=[];
    el.style.position='relative';el.style.zIndex='1';el.style.willChange='transform';
    const end=()=>{anims.forEach(a=>{try{a.cancel()}catch(e){}});if(g&&g.parentNode)g.remove();el.style.position='';el.style.zIndex='';el.style.willChange='';cleanup=null};
    cleanup=end;
    let ms=420,done;
    if(kind==='open'){
      let o=null;
      if(lastClick&&lastClick.page===top.page&&Date.now()-lastClick.at<1500)o=local(lastClick.rect);
      lastClick=null;
      if(!o)o={w:60,h:60,cx:W/2,cy:H*.7};
      origins[top.page]=o;
      const p=iconPose(o);
      anims.push(play(el,[{transform:p.transform,clipPath:p.clipPath,opacity:0},{opacity:1,offset:.22},{transform:FULL.transform,clipPath:FULL.clipPath,opacity:1}],ms));
      anims.push(play(g,[{transform:'scale(1)',opacity:1},{transform:'scale(.9)',opacity:0}],ms,{easing:'ease-out'}));
      g.style.zIndex='0';
      done=anims[0];
    }else if(kind==='close'){
      const root=old.root;let o=null;
      const er=el.getBoundingClientRect();
      if(root){
        const cands=[...el.querySelectorAll('[data-go="'+root+'"]')];
        for(const c of cands){const ic=c.querySelector('.app-icon')||c;const r=ic.getBoundingClientRect();if(r.width>0&&r.left>=er.left-2&&r.right<=er.right+2){o=local(r);break}}
      }
      if(!o)o=origins[root]||{w:60,h:60,cx:W/2,cy:H*.7};
      const p=iconPose(o);
      ms=400;
      anims.push(play(g,[{transform:FULL.transform,clipPath:FULL.clipPath,opacity:1},{opacity:1,offset:.7},{transform:p.transform,clipPath:p.clipPath,opacity:0}],ms));
      anims.push(play(el,[{transform:'scale(.9)',opacity:0},{transform:'scale(1)',opacity:1}],ms,{easing:'ease-out'}));
      g.style.zIndex='2';
      done=anims[0];
    }else if(kind==='unlock'){
      ms=480;
      anims.push(play(g,[{transform:'translateY(0px)',clipPath:clipInset(0,0,0,0,R),opacity:1},{opacity:1,offset:.5},{transform:`translateY(${-H*.45}px)`,clipPath:clipInset(H*.45,0,0,0,R),opacity:0}],ms));
      anims.push(play(el,[{transform:'scale(.92)',opacity:.4},{transform:'scale(1)',opacity:1}],ms));
      done=anims[0];
    }else if(kind==='push'){
      ms=400;
      anims.push(play(el,[{transform:`translateX(${W}px)`,clipPath:clipInset(0,W,0,0,R)},{transform:'translateX(0px)',clipPath:clipInset(0,0,0,0,R)}],ms));
      anims.push(play(g,[{transform:'translateX(0px)',clipPath:clipInset(0,0,0,0,R),filter:'brightness(1)'},{transform:`translateX(${-W*.3}px)`,clipPath:clipInset(0,0,0,W*.3,R),filter:'brightness(.82)'}],ms));
      g.style.zIndex='0';
      done=anims[0];
    }else{ // pop
      ms=380;
      anims.push(play(g,[{transform:'translateX(0px)',clipPath:clipInset(0,0,0,0,R)},{transform:`translateX(${W}px)`,clipPath:clipInset(0,W,0,0,R)}],ms));
      anims.push(play(el,[{transform:`translateX(${-W*.3}px)`,clipPath:clipInset(0,0,0,W*.3,R),filter:'brightness(.82)'},{transform:'translateX(0px)',clipPath:clipInset(0,0,0,0,R),filter:'brightness(1)'}],ms));
      g.style.zIndex='2';
      done=anims[0];
    }
    done.finished.then(()=>{if(cleanup===end)end()}).catch(()=>{});
  };
})();
</script>
